# Aegis main config — nginx-style DSL.
#
# Aegis DSL is nginx-like, not full nginx — it does NOT support
# arbitrary nginx directives (no rewrite, no fastcgi, no upstream
# groups, etc.). Everything Aegis-specific lives in its own blocks:
# `filters { ... }`, `rate_limit { ... }`, etc.
#
# Test syntax without booting the proxy:
#     aegis -t
#     aegis -c /etc/aegis/aegis.conf config test
#
# Live-reload a running proxy after editing this file:
#     curl -X POST -H "x-admin-token: $TOKEN" http://127.0.0.1:9090/admin/reload

admin {
    listen 127.0.0.1:9090;
    # token admin REPLACE_WITH_LONG_RANDOM;
    # token read  READ_ONLY_TOKEN;
    # audit_log_path /var/log/aegis/audit.log;
}

defaults {
    request_timeout    10s;
    graceful_shutdown  10s;
    header_read_timeout 5s;

    filters {
        waf                       on;
        bot_fingerprint           on;
        adaptive_spike_detection  on;
        # challenge_ladder is opt-in per domain — enable it on a
        # `server { ... }` block for sites that need browser
        # verification. Default-on would challenge every client of
        # every site, including API and non-browser traffic.
        challenge_ladder          off;
    }

    rate_limit {
        requests_per_second 100;
        burst 200;
    }
}

# Default upstream — everything that doesn't match a server_name lands here.
server {
    listen 0.0.0.0:80 default_server;

    proxy_pass http://127.0.0.1:8000;
}

# Per-host route with tighter rate limit.
server {
    listen 0.0.0.0:80;
    listen 0.0.0.0:443 ssl http2 http3;

    server_name api.example.com;

    ssl_certificate     /etc/aegis/certs/api.crt;
    ssl_certificate_key /etc/aegis/certs/api.key;

    proxy_pass http://127.0.0.1:3001;

    rate_limit {
        requests_per_second 20;
        burst 50;
    }
}

server {
    listen 0.0.0.0:80;
    listen 0.0.0.0:443 ssl http2 http3;

    server_name app.example.com;

    ssl_certificate     /etc/aegis/certs/app.crt;
    ssl_certificate_key /etc/aegis/certs/app.key;

    proxy_pass http://127.0.0.1:3002;
}

# Add more sites by dropping .conf files into sites-enabled/ then
# `aegis reload` (or POST /admin/reload). Empty glob is a warning,
# not an error — staging order doesn't matter.
# include /etc/aegis/sites-enabled/*.conf;
